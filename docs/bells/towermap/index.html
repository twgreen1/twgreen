<!DOCTYPE html>
<html>
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="../../Leaflet.geoCSV-master/leaflet.geocsv.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

.back-button {
    position: absolute;
    top: 10px;
    left: 10px;
}

.content {
    width: 80vw;
    margin: 0 auto;
}

#map {
    height: 100vh;
    width: 100%;
}
</style>
<title>Tower Map</title>
</head>
<body>    
<a class="back-button" href="../index.html">Back</a>

<div class="content">
<p>Find below an interactive map of all the towers I have rung at, if you give a shit!</p>

<div id="map">
<script>
var map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'}).addTo(map);

function createBellIcon(number) {
    return L.icon({
        iconUrl: number + '.png',
        iconSize: [36, 36],
        iconAnchor: [18, 36],
        popupAnchor: [0, -36]
    });
}

var threeBell = createBellIcon(3);
var fourBell = createBellIcon(4);
var fiveBell = createBellIcon(5);
var sixBell = createBellIcon(6);
var eightBell = createBellIcon(8);
var tenBell = createBellIcon(10);
var twelveBell = createBellIcon(12);
var fourteenBell = createBellIcon(14);
var sixteenBell = createBellIcon(16);

fetch("tower_data.csv")
    .then(response => response.text())
    .then(csvContents => {

        var geoLayer = L.geoCsv(csvContents, {
            fieldSeparator: ',',
            firstLineTitles: true,
            latitudeTitle: 'lat',
            longitudeTitle: 'lng',

            pointToLayer: function (feature, latlng) {
                if(feature.properties.number_bells == '3') {
                    return L.marker(latlng, {icon: threeBell});
                } else if(feature.properties.number_bells == '4') {
                    return L.marker(latlng, {icon: fourBell});
                } else if(feature.properties.number_bells == '5') {
                    return L.marker(latlng, {icon: fiveBell});
                } else if(feature.properties.number_bells == '6') {
                    return L.marker(latlng, {icon: sixBell});
                } else if(feature.properties.number_bells == '8') {
                    return L.marker(latlng, {icon: eightBell});
                } else if(feature.properties.number_bells == '10') {
                    return L.marker(latlng, {icon: tenBell});
                } else if(feature.properties.number_bells == '12') {
                    return L.marker(latlng, {icon: twelveBell});
                } else if(feature.properties.number_bells == '14') {
                    return L.marker(latlng, {icon: fourteenBell});
                } else if(feature.properties.number_bells == '16') {
                    return L.marker(latlng, {icon: sixteenBell});
                }
            },

            onEachFeature: function (feature, layer) {
    var name = feature.properties.name;
    var dedication = feature.properties.dedication;
    var county = feature.properties.county;
    var dove = feature.properties.dove;
    var firstVisit = feature.properties.first_visit;

    var popupContent =
        '<b><a href="' + dove + '" target="_blank">' + name + '</a></b><br>' +
        dedication + '<br>' +
        county;

    // Only show First Visit if it has a value
    if (firstVisit && firstVisit.trim() !== '') {
        popupContent += '<br>First Visit: ' + firstVisit;
    }

    layer.bindPopup(popupContent);
}
        });

        map.addLayer(geoLayer);
        map.fitBounds(geoLayer.getBounds());

        

    });

</script>

</div>
</div>
</body>
</html>
