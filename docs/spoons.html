<!DOCTYPE html>
<html>
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="Leaflet.geoCSV-master/leaflet.geocsv.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
}

.back-button {
    position: absolute;
    top: 10px;
    left: 10px;
}

.content {
    width: 80vw;
    margin: 0 auto;
}

#map {
    height: 100vh;
    width: 100%;
}
</style>
<title>Spoons</title>
</head>
<body>    
<a class="back-button" href="../index.html">Back</a>

<div class="content">
<p>Here is a (probably not very comprehensive) interactive map of the Wetherspoon establishments I have visited.</p>

<div id="map">
<script>
var map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'}).addTo(map);


fetch("spoons.csv")
    .then(response => response.text())
    .then(csvContents => {

        var geoLayer = L.geoCsv(csvContents, {
            fieldSeparator: ',',
            firstLineTitles: true,
            latitudeTitle: 'lat',
            longitudeTitle: 'lng',

           
            onEachFeature: function (feature, layer) {
        var name = feature.properties.name;
        var place = feature.properties.place;
        var county = feature.properties.county;

    var popupContent =
        '<b>' + name + '</b><br>' +
            place + '<br>' +
            county;

            

    layer.bindPopup(popupContent);
}
        });

        map.addLayer(geoLayer);
        map.fitBounds(geoLayer.getBounds());

        

    });

</script>

</div>
</div>
</body>
</html>
