<!DOCTYPE html>
<html>
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
     <script src="docs/test/leaflet.geocsv.js"></script>

<style>
    body {
    padding: 0;
    margin-left: 25vw;
}
html, body, #map {
    height: 100%;
    width: 50vw;
   
}


</style>
</head>
<body>
       <!-- <p>This is a test paragraph</p> -->
    
    <div id="map"></div>
       <script>var map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var geoCsvLayer = L.geoCsv(null, {
      latitudeTitle: 'lat',
      longitudeTitle: 'lng',
      titles: ['lat','lng','name']
    });

    geoCsvLayer.addTo(map);
    geoCsvLayer.loadCSV("docs/test/test.csv");

  geoCsvLayer.on('loaded', function(e) {
  console.log("Loaded features:", e.features.length);
});


</script>
    
</body>
</html>
