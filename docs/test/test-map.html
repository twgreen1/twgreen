<!DOCTYPE html>
<html>
<head>
   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
      <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
<script src="Leaflet.geoCSV-master/leaflet.geocsv.js"></script>

<style>
    body {
    padding: 0;
    margin-left: 25vw;
}
html, body, #map {
    height: 100%;
    width: 50vw;
   
}


</style>
</head>
<body>
       <!-- <p>This is a test paragraph</p> -->
    
<div id="map">

    <script>
var map = L.map('map').setView([52, 0], 6);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

var duckGeneral = L.icon({
    iconUrl: 'rubber-156597-2.svg',
    iconSize: [38,80],
    iconAnchor: [15,50],
    popupAnchor: [0,-50]
})

var duckSpecial = L.icon({
    iconUrl: 'rubber-156597.svg',
    iconSize: [30,50],
    iconAnchor: [15,50],
    popupAnchor: [0,-50]
})

fetch("test.csv")
    .then(response => response.text())
    .then(csvContents => {

        var geoLayer = L.geoCsv(csvContents, {
            fieldSeparator: ',',
            firstLineTitles: true,
            latitudeTitle: 'lat',
            longitudeTitle: 'lng',

            pointToLayer: function (feature, latlng) {
                if(feature.properties.type === 'special') {
                    return L.marker(latlng, {icon: duckSpecial});
                } else {
                    return L.marker(latlng, {icon: duck});
                }
            },

            onEachFeature: function (feature, layer) {
                var name = feature.properties.name;
                var type = feature.properties.type;
                layer.bindPopup(
                    name + '<br>' +
                    '<a href="https://twgreen.uk">' + type + '</a>'
                )
            }
        });

        map.addLayer(geoLayer);
        map.fitBounds(geoLayer.getBounds());
    });

</script>

</div>
    
</body>
</html>
