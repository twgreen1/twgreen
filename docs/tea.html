<script type="module">

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


    import {
        getDatabase,
        ref,
        onValue,
        update,
        increment,
        get
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    /* Firebase configuration */

    const firebaseConfig = {

        apiKey:
            "AIzaSyBvh1IVs4GBJIGQgTPUoGDQ9cVGvy17ySE",

        authDomain:
            "teacounter-89965.firebaseapp.com",

        projectId:
            "teacounter-89965",

        storageBucket:
            "teacounter-89965.firebasestorage.app",

        messagingSenderId:
            "820125781317",

        appId:
            "1:820125781317:web:d6e6543d43bb37d219822c",

        databaseURL:
            "https://teacounter-89965-default-rtdb.firebaseio.com/"
    };


    /* Initialise Firebase */

    const app =
        initializeApp(firebaseConfig);

    const database =
        getDatabase(app);


    /* Shared counter location */

    const teaRef =
        ref(database, "teaCounters");


    /*
     * Listen for changes.
     *
     * This keeps every device synchronised.
     */

    onValue(
        teaRef,
        (snapshot) => {

            const data =
                snapshot.val() || {};


            const thomas =
                data.thomas || 0;

            const liam =
                data.liam || 0;


            document.getElementById(
                "thomasCount"
            ).textContent = thomas;


            document.getElementById(
                "liamCount"
            ).textContent = liam;
        }
    );


    /*
     * ========================================================
     * ADD TEA
     * ========================================================
     */

    window.addTea =
        async function(person) {

            try {

                /*
                 * Atomically add one.
                 */

                await update(
                    ref(database),
                    {
                        ["teaCounters/" + person]:
                            increment(1)
                    }
                );


                /*
                 * The database has been updated.
                 *
                 * Now unleash the kettle.
                 */

                unleashTeaMayhem();

            }

            catch (error) {

                console.error(
                    "Error adding tea:",
                    error
                );

                alert(
                    "Couldn't add the tea. Check your internet connection."
                );
            }
        };


    /*
     * ========================================================
     * REMOVE TEA
     * ========================================================
     */

    window.removeTea =
        async function(person) {

            try {

                const counterRef =
                    ref(
                        database,
                        "teaCounters/" + person
                    );


                const snapshot =
                    await get(counterRef);


                const current =
                    snapshot.exists()
                        ? Number(snapshot.val())
                        : 0;


                /*
                 * Don't allow negative counters.
                 */

                if (current <= 0) {
                    return;
                }


                await update(
                    ref(database),
                    {
                        ["teaCounters/" + person]:
                            increment(-1)
                    }
                );

            }

            catch (error) {

                console.error(
                    "Error removing tea:",
                    error
                );
            }
        };


    /*
     * ========================================================
     * RESET
     * ========================================================
     */

    window.resetCounters =
        async function() {

            if (
                !confirm(
                    "Are you sure you want to reset both counters?"
                )
            ) {
                return;
            }


            try {

                await update(
                    ref(database),
                    {
                        "teaCounters/thomas": 0,
                        "teaCounters/liam": 0
                    }
                );

            }

            catch (error) {

                console.error(
                    "Error resetting counters:",
                    error
                );
            }
        };


    /*
     * ========================================================
     * TEA MAYHEM
     * ========================================================
     */

    let animationRunning = false;


    function unleashTeaMayhem() {

        /*
         * Don't let someone spam the button and break
         * the animation.
         */

        if (animationRunning) {
            return;
        }


        animationRunning = true;


        const overlay =
            document.getElementById(
                "teaMayhem"
            );


        overlay.classList.add("active");


        /*
         * KETTLE BOILS
         */

        setTimeout(() => {

            /*
             * Screen starts shaking just before
             * the kettle explodes.
             */

            document.body.classList.add(
                "screen-shake"
            );

        }, 1300);


        /*
         * TEA EXPLOSION
         */

        setTimeout(() => {

            launchTeaParticles();

            launchBursts();

        }, 1350);


        /*
         * CLEAN UP
         */

        setTimeout(() => {

            overlay.classList.remove(
                "active"
            );

            document.body.classList.remove(
                "screen-shake"
            );

            animationRunning = false;

        }, 3000);
    }


    /*
     * ========================================================
     * FLYING TEA CUPS
     * ========================================================
     */

    function launchTeaParticles() {

        const teas = [

            "☕",
            "☕",
            "🍵",
            "☕",
            "☕",
            "🍵",
            "☕",
            "☕",
            "🍵",
            "☕",
            "☕",
            "☕",
            "🍵",
            "☕",
            "☕",
            "☕"

        ];


        teas.forEach(
            (tea, index) => {

                const particle =
                    document.createElement(
                        "div"
                    );


                particle.className =
                    "tea-particle fly";


                particle.textContent =
                    tea;


                /*
                 * Calculate an explosion direction.
                 */

                const angle =
                    (
                        Math.PI * 2 *
                        index /
                        teas.length
                    )
                    +
                    (
                        Math.random() -
                        .5
                    )
                    * .5;


                const distance =
                    180 +
                    Math.random() * 450;


                particle.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );


                particle.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                particle.style.setProperty(
                    "--scale",
                    .5 +
                    Math.random() * 1.2
                );


                particle.style.setProperty(
                    "--rotation",
                    (
                        Math.random() *
                        1000 -
                        500
                    ) +
                    "deg"
                );


                particle.style.animationDelay =
                    Math.random() *
                    .15 +
                    "s";


                document.body.appendChild(
                    particle
                );


                setTimeout(
                    () => {
                        particle.remove();
                    },
                    1800
                );

            }
        );
    }


    /*
     * ========================================================
     * EXPLOSION RAYS
     * ========================================================
     */

    function launchBursts() {

        for (
            let i = 0;
            i < 24;
            i++
        ) {

            const burst =
                document.createElement(
                    "div"
                );


            burst.className =
                "burst fly";


            const angle =
                (360 / 24) * i;


            const distance =
                180 +
                Math.random() * 400;


            burst.style.setProperty(
                "--rotation",
                angle + "deg"
            );


            burst.style.setProperty(
                "--x",
                Math.cos(
                    angle *
                    Math.PI /
                    180
                ) *
                distance +
                "px"
            );


            burst.style.setProperty(
                "--y",
                Math.sin(
                    angle *
                    Math.PI /
                    180
                ) *
                distance +
                "px"
            );


            burst.style.animationDelay =
                Math.random() *
                .1 +
                "s";


            document.body.appendChild(
                burst
            );


            setTimeout(
