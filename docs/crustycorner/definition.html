        <p><strong>crusty corner</strong>, n. A corner that, when describing it, one may consider crusty. Also used in football-style chants to amuse Thomas. See also: <strong>slitchy.</strong></p>
        <p><strong>slitchy</strong>, adj. A portmanteau of 'slimy' and 'itchy'. Can be used to describe one's crusty corner.</p>
